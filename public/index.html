<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5524E8" />

    <!-- SEO básico -->
    <meta
      name="description"
      content="LanceiHub - Plataforma completa para leilões, calculadoras financeiras, checklists de investimento e oportunidades de negócio. Gerencie seus leilões com eficiência e segurança."
    />
    <meta
      name="keywords"
      content="leilão, leilões, calculadora financeira, investimento, oportunidade, checklist, arrematação, lance, plataforma de leilões, Brasil"
    />
    <meta name="author" content="LanceiHub" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="language" content="Portuguese" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn etc.) -->
    <meta property="og:title" content="LanceiHub" />
    <meta
      property="og:description"
      content="Plataforma completa para leilões, calculadoras financeiras e oportunidades de investimento. Gerencie seus leilões com eficiência e segurança."
    />
    <meta
      property="og:image"
      content="https://lanceihub.com/LogoHorizontalP.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://lanceihub.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LanceiHub" />
    <meta
      name="twitter:description"
      content="Plataforma completa para leilões e investimentos."
    />
    <meta
      name="twitter:image"
      content="https://lanceihub.com/LogoHorizontalP.png"
    />
    <meta name="twitter:site" content="@LanceiHub" />

    <!-- Structured Data (JSON-LD) para Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LanceiHub",
      "url": "https://lanceihub.com",
      "logo": "https://lanceihub.com/logo_google.png",
      "image": {
        "@type": "ImageObject",
        "url": "https://lanceihub.com/logo_google.png",
        "width": 1200,
        "height": 630
      },
      "description": "Plataforma completa para leilões, calculadoras financeiras, checklists de investimento e oportunidades de negócio.",
      "foundingDate": "2025",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "",
        "contactType": "customer service",
        "email": "suporte@lanceihub.com"
      },
      "sameAs": [
        "https://lanceihub.com"
      ],
      "offers": [
        {
          "@type": "Service",
          "name": "Calculadoras Financeiras",
          "description": "Ferramentas para cálculo de investimentos e leilões."
        },
        {
          "@type": "Service",
          "name": "Checklists de Investimento",
          "description": "Listas de verificação para processos de investimento."
        },
        {
          "@type": "Service",
          "name": "Oportunidades de Leilão",
          "description": "Plataforma para encontrar e participar de leilões."
        }
      ]
    }
    </script>
